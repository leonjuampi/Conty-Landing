# Rate limiting: 10 req/s sostenido, permite ráfagas de hasta 30
# NOTA: mientras no usemos set_real_ip_from + CF-Connecting-IP, esto limita
# por IP del proxy (Traefik/Dokploy), no por IP real del cliente.
limit_req_zone $binary_remote_addr zone=conty_landing:10m rate=10r/s;

# Bloquear User-Agents de escáneres autodeclarados o herramientas ofensivas conocidas
map $http_user_agent $bad_user_agent {
    default                      0;
    "~*SecurityScanner"          1;
    "~*nikto"                    1;
    "~*sqlmap"                   1;
    "~*nmap"                     1;
    "~*masscan"                  1;
    "~*zgrab"                    1;
    "~*CensysInspect"            1;
    "~*Cortex Xpanse"            1;
    "~*Expanse"                  1;
    "~*fuzzer"                   1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # User-Agents maliciosos: cerrar conexión sin respuesta
    if ($bad_user_agent) { return 444; }

    # Querystrings sospechosos (CVE-2012-1823 PHP-CGI, intentos de phpinfo, eval, etc.)
    if ($args ~* "(^|&)-") { return 444; }
    if ($args ~* "(phpinfo|eval|base64_decode|system|exec|passthru|assert)\s*\(") { return 444; }

    # ---- Dotfiles y archivos sensibles ----
    location ~ /\.(env|git|aws|ssh|kube|docker|npmrc|netrc|htpasswd|svn|hg|bzr|DS_Store) { return 444; }
    location ~ /\.git-credentials                           { return 444; }
    location ~ /\.(anthropic|openai|cursor|claude)          { return 444; }

    # Permitir explícitamente .well-known (certbot, etc.)
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # ---- Paths típicos de escáneres automatizados ----
    # WordPress / Joomla / Drupal / phpMyAdmin
    location ~* /(wp-admin|wp-login|wp-content|wp-includes|wp-json|wordpress|wp-config) { return 444; }
    location ~* /xmlrpc\.php                                { return 444; }
    location ~* /wlwmanifest\.xml                           { return 444; }
    location ~* /(administrator|joomla|drupal|phpmyadmin|pma|adminer)(/|$) { return 444; }

    # PHP scanners (la app es Vite, no servimos PHP)
    location ~* /vendor/phpunit                             { return 444; }
    location ~* /(phpinfo|info|test|debug|php)\.php$        { return 444; }
    location ~* \.php$                                      { return 444; }

    # Diagnóstico/admin de stacks que no usamos
    location ~* /(server-status|server-info|nginx_status)   { return 444; }
    location ~* /actuator(/|$)                              { return 444; }
    location ~* /_(profiler|ignition)                       { return 444; }
    location ~* /(file-manager|fckeditor|cacti|cgi-bin)     { return 444; }

    # Backups, dumps y secretos comunes
    location ~* \.(sql|sql\.gz|bak|backup|old|orig|swp|swo|zip|tar|tar\.gz|tgz|7z|rar|dump|dmp)$ { return 444; }
    location ~* /(backup|dump|website-backup)               { return 444; }
    location = /secrets.json                                { return 444; }
    location = /credentials.json                            { return 444; }
    location = /serviceAccountKey.json                      { return 444; }
    location = /terraform.tfstate                           { return 444; }
    location = /terraform.tfvars                            { return 444; }
    location ~* /aws.*\.(ya?ml|json)$                       { return 444; }

    # ---- Tráfico legítimo del frontend ----

    # Archivos con extensión: si no existen devolvemos 404
    location ~* \.(js|mjs|css|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot|json|map|txt|xml|html?)$ {
        limit_req zone=conty_landing burst=30 nodelay;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas del SPA: fallback a index.html
    location / {
        limit_req zone=conty_landing burst=30 nodelay;
        try_files $uri /index.html;
    }
}
